{{- $publicOrigin := trim (toString .Values.publicOrigin) -}}
{{- if not $publicOrigin }}
{{- fail "publicOrigin is required" }}
{{- end }}
{{- $ticketSecret := trim (toString .Values.ticketSecret) -}}
{{- if not $ticketSecret }}
{{- fail "ticketSecret is required" }}
{{- end }}
{{- $controlToken := trim (toString .Values.controlToken) -}}
{{- if not $controlToken }}
{{- fail "controlToken is required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apemind-computer.fullname" . }}
  labels:
    {{- include "apemind-computer.labels" . | nindent 4 }}
type: Opaque
stringData:
  ticketSecret: {{ $ticketSecret | quote }}
  controlToken: {{ $controlToken | quote }}
