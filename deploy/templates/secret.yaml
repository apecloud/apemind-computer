{{- $publicOrigin := trim (toString .Values.publicOrigin) -}}
{{- if not $publicOrigin }}
{{- fail "publicOrigin is required" }}
{{- end }}
{{- $ticketSecret := trim (toString .Values.ticketSecret) -}}
{{- $controlToken := trim (toString .Values.controlToken) -}}
{{- $pairCode := trim (toString .Values.pairCode) -}}
{{- if or (and $ticketSecret (not $controlToken)) (and $controlToken (not $ticketSecret)) }}
{{- fail "ticketSecret and controlToken must be set together (pre-shared mode) or both left empty (pairing mode)" }}
{{- end }}
{{- if or $ticketSecret $pairCode }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apemind-computer.fullname" . }}
  labels:
    {{- include "apemind-computer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ticketSecret }}
  ticketSecret: {{ $ticketSecret | quote }}
  controlToken: {{ $controlToken | quote }}
  {{- end }}
  {{- if $pairCode }}
  pairCode: {{ $pairCode | quote }}
  {{- end }}
{{- end }}
