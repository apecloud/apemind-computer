apiVersion: v1
kind: Service
metadata:
  name: {{ include "apemind-computer.fullname" . }}
  labels:
    {{- include "apemind-computer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "apemind-computer.selectorLabels" . | nindent 4 }}
  ports:
    - name: gateway
      port: 8080
      targetPort: gateway
    - name: control
      port: 9090
      targetPort: control
