name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sandbox sources are in-repo and not a remote Treadstone FROM
        run: |
          set -euo pipefail
          test -f sandbox-image/Dockerfile
          test -f sandbox-image/reconstructed/Dockerfile
          if grep -R -n 'ghcr.io/earayu/treadstone-sandbox' sandbox-image Dockerfile 2>/dev/null; then
            echo "sandbox image must not FROM ghcr.io/earayu/treadstone-sandbox"
            exit 1
          fi
          grep -q 'FROM ubuntu:22.04' sandbox-image/reconstructed/Dockerfile
