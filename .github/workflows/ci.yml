name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: host-agent/package-lock.json

      - name: Ticket vectors match the generator
        run: python3 tests/vectors/generate.py --check

      - name: Density script safety checks
        run: python3 tests/density/test_density.py

      - name: Install
        working-directory: host-agent
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        working-directory: host-agent
        run: npm run typecheck

      - name: Test
        working-directory: host-agent
        run: npm test

      - name: Build bundle
        working-directory: host-agent
        run: npm run build

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: computer-smoke:${{ github.sha }}
          cache-from: |
            type=gha,scope=computer-release
            type=gha,scope=computer-${{ matrix.arch }}
          cache-to: type=gha,scope=computer-${{ matrix.arch }},mode=min,timeout=5m,ignore-error=true

      - name: Verify image tools and real service startup
        shell: bash
        run: |
          set -euo pipefail
          image="computer-smoke:${{ github.sha }}"
          docker run --rm --network none --entrypoint sh "$image" -ec '
            test -x /usr/local/bin/dsh-exec
            test -s /usr/local/share/apemind-computer/settings.json
            test -s /opt/dsh-seed/.dsh/profiles/web/node_modules/@xmanrui/dsh-im/package.json
            test -s /opt/dsh-seed/.dsh/profiles/web/node_modules/@michengai/dsh-automation/package.json
            node --version
            pnpm --version
            apemind version
          '
          cid=$(docker run -d --network none -e COMPUTER_PUBLIC_ORIGIN=http://127.0.0.1:8080 "$image")
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$cid" node -e 'fetch("http://127.0.0.1:8080/__healthz").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          docker image inspect --format 'image_bytes={{.Size}}' "$image"

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint deploy

      - name: Render chart
        run: helm template computer-host deploy -f deploy/ci/values-ci.yaml > /tmp/computer-host.yaml

      - name: Required objects are present
        run: |
          set -euo pipefail
          for kind in Secret PersistentVolumeClaim Deployment Service Ingress; do
            grep -q "^kind: ${kind}$" /tmp/computer-host.yaml
          done
          grep -q "COMPUTER_TICKET_SECRET" /tmp/computer-host.yaml
          grep -q "path: /__healthz" /tmp/computer-host.yaml
