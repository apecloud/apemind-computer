name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dockerfile exists and pins the Treadstone sandbox
        run: |
          set -euo pipefail
          test -f Dockerfile
          grep -q 'ghcr.io/earayu/treadstone-sandbox:v0.2.1' Dockerfile
